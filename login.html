<div class="modal hidden" id="profileModal">
    <div class="modal-card auth-card" style="text-align: left; max-width: 550px;">
        <button class="close" data-close="profileModal">×</button>
        <div style="text-align: center;">
            <div class="profile-avatar">👤</div>
            <span class="eyebrow">मेरी प्रोफाइल</span>
            <h2 style="font-size: 26px; margin: 8px 0;">अपनी प्रोफाइल देखें</h2>
            <p style="margin-bottom: 20px;">भावसेतु पर आपकी सत्यापित खाता जानकारी।</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label style="font-weight: 700; font-size: 12px; display: block; margin-bottom: 5px; color: var(--text);">पूरा नाम</label>
                <input id="profileName" type="text" readonly style="width: 100%; padding: 10px; background: rgba(0,0,0,0.04); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--text); cursor: not-allowed;">
            </div>
            <div>
                <label style="font-weight: 700; font-size: 12px; display: block; margin-bottom: 5px; color: var(--text);">ईमेल आईडी</label>
                <input id="profileEmail" type="text" readonly style="width: 100%; padding: 10px; background: rgba(0,0,0,0.04); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--text); cursor: not-allowed;">
            </div>
            <div>
                <label style="font-weight: 700; font-size: 12px; display: block; margin-bottom: 5px; color: var(--text);">गाँव / शहर</label>
                <input id="profileVillage" type="text" readonly style="width: 100%; padding: 10px; background: rgba(0,0,0,0.04); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--text); cursor: not-allowed;">
            </div>
            <div>
                <label style="font-weight: 700; font-size: 12px; display: block; margin-bottom: 5px; color: var(--text);">राज्य / केंद्र शासित प्रदेश</label>
                <input id="profileState" type="text" readonly style="width: 100%; padding: 10px; background: rgba(0,0,0,0.04); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--text); cursor: not-allowed;">
            </div>
            <div>
                <label style="font-weight: 700; font-size: 12px; display: block; margin-bottom: 5px; color: var(--text);">जिला</label>
                <input id="profileDistrict" type="text" readonly style="width: 100%; padding: 10px; background: rgba(0,0,0,0.04); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--text); cursor: not-allowed;">
            </div>
            <div>
                <label style="font-weight: 700; font-size: 12px; display: block; margin-bottom: 5px; color: var(--text);">मोबाइल नंबर</label>
                <input id="profilePhone" type="text" readonly style="width: 100%; padding: 10px; background: rgba(0,0,0,0.04); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--text); cursor: not-allowed;">
            </div>
        </div>

        <p id="profileStatus" class="profile-status" style="margin-top: 20px; text-align: center; font-weight: 600; color: var(--g);"></p>
    </div>
</div>
